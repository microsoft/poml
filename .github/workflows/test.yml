name: Full Test

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main
      - master
  pull_request:

  workflow_dispatch:

jobs:
  browser-build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
      - name: Use Node.js 22.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: 'npm'
      # This step should not be necessary, but without it,
      # currently ../poml won't be able to locate dependencies
      - name: Install base dependencies
        run: |
          npm ci
      - name: Install dependencies
        run: |
          cd packages/poml-browser
          npm ci
      - name: Install Playwright browsers
        run: |
          cd packages/poml-browser
          npx playwright install chromium
      - name: Build poml-browser (warnings as errors)
        run: |
          cd packages/poml-browser
          npm run build:test
        env:
          WARNINGS_AS_ERRORS: 'true'
      - name: Run vitest tests
        run: |
          cd packages/poml-browser
          npm run test:vitest -- --run

      - uses: nick-invision/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        if: matrix.os == 'macos-latest'
        with:
          max_attempts: 3
          timeout_minutes: 20
          command: |
            cd packages/poml-browser
            npm run test:playwright
        name: Run playwright tests (macOS)

      - name: Run playwright tests (Linux)
        run: |
          cd packages/poml-browser
          xvfb-run -a npm run test:playwright
        if: matrix.os == 'ubuntu-latest'

      - name: Run playwright tests (other OS)
        run: |
          cd packages/poml-browser
          npm run test:playwright
        if: matrix.os != 'ubuntu-latest' && matrix.os != 'macos-latest'

  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-latest
            platform: win32-x64
          - os: macos-13
            platform: darwin-x64
          - os: macos-latest
            platform: darwin-arm64
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use Node.js 22.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: 'npm'
      - name: Use Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run build-webview
      - run: npm run build-cli
      - run: npm run validate-component-spec
        if: matrix.os == 'ubuntu-latest'
      - run: npm run package:win
        if: matrix.platform == 'win32-x64'
      - run: npm run package -- --target ${{ matrix.platform }}
        if: matrix.platform != 'win32-x64'
      - run: python -m pip install -e .[dev]
      - run: xvfb-run -a npm test
        if: runner.os == 'Linux'
      - run: npm test
        if: runner.os != 'Linux'
      - run: python -m pytest -v python/tests
      - run: xvfb-run -a npm run compile && xvfb-run -a npm run test-vscode
        if: runner.os == 'Linux'
      - uses: nick-invision/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        if: matrix.os == 'macos-13'
        with:
          max_attempts: 3
          timeout_minutes: 10
          command: npm run compile && npm run test-vscode
      - run: npm run compile && npm run test-vscode
        if: runner.os != 'Linux' && matrix.os != 'macos-13'

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use Node.js 22.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: 'npm'
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build-cli
      - run: npm run format:check
      - run: npm run lint
      - run: python -m pip install -e .[dev]
      - run: isort --check-only .
      - run: black --check .

  docs:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Fetch all history for versioning

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Build cli
        run: npm run build-cli

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Generate component documentation
        run: npm run validate-component-spec

      - name: Generate TypeScript API documentation
        run: npm run typedoc

      - name: Build documentation
        run: mkdocs build

      - name: Upload documentation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: documentation-site
          path: site/
